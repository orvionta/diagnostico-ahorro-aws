name: Validar plantilla

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint iam/*.yaml
      - name: shellcheck
        run: shellcheck scripts/*.sh
